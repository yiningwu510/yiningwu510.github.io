  bio: >
    I am a Post-Doctoral Research Associate in the Department of Agricultural
    and Resource Economics and Baker School of Public Policy and Public Affairs
    at the University of Tennessee, Knoxville. I received my Ph.D. in
    Agricultural, Environmental, and Development Economics from The Ohio State
    University in 2025.


    My research studies the sustainability of human–natural systems linking
    land, water, and carbon, integrating economic and biogeochemical models
    to understand how land management shapes ecosystem services, and to inform
    conservation policy. My current work focuses on grazinglands, combining
    integrated modeling with producer surveys to inform the design of
    conservation contracts.


    If you'd like to talk about research or work together, feel free to
    reach out by email. Thanks for stopping by.
  research_areas:
    - "Grazingland management and profitability"
    - "Land use change"
    - "Soil carbon sequestration"
    - "Conservation policy and program design"
    - "Agricultural nutrient runoff and water quality"
    - "Non-market valuation of recreation"
